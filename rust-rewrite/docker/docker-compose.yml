version: '3.8'

services:
  # Quepid API Server
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: quepid-api
    restart: unless-stopped
    environment:
      - QUEPID_ENV=development
      - RUST_LOG=debug
      - DATABASE_URL=mysql://root:password@mysql/quepid_development
      - QUEPID_SERVER_HOST=0.0.0.0
      - QUEPID_SERVER_PORT=3000
      - QUEPID_JWT_SECRET=change-me-in-production
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../rust-rewrite:/app/rust-rewrite
    networks:
      - quepid-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: quepid-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=quepid_development
      - MYSQL_USER=quepid
      - MYSQL_PASSWORD=quepid
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - quepid-network

  # PostgreSQL Database (alternative)
  postgres:
    image: postgres:14
    container_name: quepid-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=quepid_development
      - POSTGRES_USER=quepid
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - quepid-network
    profiles:
      - postgres

  # Redis for background jobs and caching
  redis:
    image: redis:7
    container_name: quepid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - quepid-network

  # Quepid Workers
  workers:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: quepid-workers
    restart: unless-stopped
    command: ["quepid-workers"]
    environment:
      - QUEPID_ENV=development
      - RUST_LOG=debug
      - DATABASE_URL=mysql://root:password@mysql/quepid_development
      - QUEPID_REDIS_URL=redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../rust-rewrite:/app/rust-rewrite
    networks:
      - quepid-network

  # Quepid WebSocket Server
  websocket:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: quepid-websocket
    restart: unless-stopped
    command: ["quepid-websocket"]
    environment:
      - QUEPID_ENV=development
      - RUST_LOG=debug
      - DATABASE_URL=mysql://root:password@mysql/quepid_development
      - QUEPID_WEBSOCKET_PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../rust-rewrite:/app/rust-rewrite
    networks:
      - quepid-network

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:1.25
    container_name: quepid-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      api:
        condition: service_started
    networks:
      - quepid-network
    profiles:
      - nginx

volumes:
  mysql-data:
  postgres-data:
  redis-data:

networks:
  quepid-network:
    driver: bridge
